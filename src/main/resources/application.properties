spring.application.name=intibak-control

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
server.port=8081

erciyesUrl=https://dbp.erciyes.edu.tr/Program/P3.aspx?Fak=103&lang=0&Pro=103051


#Ollama base url
spring.ai.ollama.base-url=http://localhost:11434


#OLLAMA Configuration

spring.ai.ollama.chat.options.model=llama3.1
spring.ai.ollama.chat.options.num-ctx=16384
spring.ai.ollama.chat.options.num-predict=7000
spring.ai.ollama.chat.options.temperature=0.0
spring.ai.ollama.chat.options.format=json
# spring.ai.ollama.chat.enabled=false

#Gemini Configuration
spring.ai.openai.base-url=https://generativelanguage.googleapis.com/v1beta/openai/
spring.ai.openai.api-key=${GEMINI_API_KEY}
spring.ai.openai.chat.options.model=gemini-3.6-flash
spring.ai.openai.chat.options.temperature=0.0
spring.ai.openai.embedding.enabled=false


#Embedding Configuration

spring.ai.ollama.embedding.options.model=bge-m3

#pgVector

spring.ai.vectorstore.pgvector.initialize-schema=true
